trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
    addToPath: true

- script: |
    curl -O https://releases.hashicorp.com/terraform/1.4.6/terraform_1.4.6_linux_amd64.zip
    unzip terraform_1.4.6_linux_amd64.zip
    sudo mv terraform /usr/local/bin/
  displayName: 'Install Terraform'

- script: |
    terraform --version
  displayName: 'Verify Terraform Installation'

- task: TerraformTaskV1@0
  inputs:
    provider: 'aws'
    command: 'init'
    workingDirectory: '$(Build.SourcesDirectory)'
    backendServiceAws: 'aws-connection' # Replace with your service connection name

- task: TerraformTaskV1@0
  inputs:
    provider: 'aws'
    command: 'apply'
    workingDirectory: '$(Build.SourcesDirectory)'
    environmentServiceName: 'aws-connection' # Replace with your service connection name
    ensureBackend: true
    vars: |
      aws_access_key_id=$(AWS_ACCESS_KEY_ID)
      aws_secret_access_key=$(AWS_SECRET_ACCESS_KEY)
  displayName: 'Terraform Apply'
